<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Noto Sans KR',sans-serif;background:#f4f3ef;color:#1a1a18;min-height:100vh;font-size:14px;line-height:1.6;}
.wrap{max-width:720px;margin:0 auto;padding:1.5rem 1rem 5rem;}
input,select,textarea,button{font-family:inherit;font-size:13px;}
input[type=text],input[type=password],select,textarea{width:100%;padding:8px 12px;border:1px solid #d3d1c7;border-radius:8px;background:#fff;color:#1a1a18;outline:none;transition:border-color .15s,box-shadow .15s;}
input[type=text]:focus,input[type=password]:focus,select:focus,textarea:focus{border-color:#1D9E75;box-shadow:0 0 0 2px rgba(29,158,117,.12);}
input[type=number]{-moz-appearance:textfield;width:100%;padding:8px 12px;border:1px solid #d3d1c7;border-radius:8px;background:#fff;color:#1a1a18;outline:none;transition:border-color .15s;}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;}
input[type=number]:focus{border-color:#1D9E75;box-shadow:0 0 0 2px rgba(29,158,117,.12);}
.card{background:#fff;border:1px solid #e0ddd5;border-radius:12px;overflow:hidden;margin-bottom:12px;}
.card-head{display:flex;justify-content:space-between;align-items:center;padding:.65rem 1.25rem;background:#f9f8f4;border-bottom:1px solid #e0ddd5;}
.card-head-title{font-size:13px;font-weight:500;}
.card-sub{font-size:11px;color:#888780;}
.badge{display:inline-block;font-size:10px;font-weight:500;padding:2px 10px;border-radius:20px;}
.bt{background:#E1F5EE;color:#0F6E56;}.bb{background:#E6F1FB;color:#185FA5;}.ba{background:#FAEEDA;color:#854F0B;}
.pill{display:inline-block;font-size:10px;font-weight:500;padding:2px 9px;border-radius:20px;}
.ph{background:#E1F5EE;color:#0F6E56;}.pm{background:#E6F1FB;color:#185FA5;}.pl{background:#FAEEDA;color:#854F0B;}.pp{background:#FCEBEB;color:#A32D2D;}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 18px;border-radius:8px;cursor:pointer;font-family:inherit;font-size:13px;font-weight:400;transition:all .15s;border:1px solid #d3d1c7;background:transparent;color:#1a1a18;}
.btn:hover{background:#f4f3ef;}
.btn.primary{background:#1D9E75;color:#fff;border-color:#1D9E75;font-weight:500;}
.btn.primary:hover{background:#178f68;}
.btn.danger{color:#A32D2D;border-color:#f09595;}
.btn.danger:hover{background:#FCEBEB;}
.btn.sm{padding:5px 12px;font-size:11px;}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.row{display:grid;gap:8px;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.score-cell{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border-left:1px solid #e0ddd5;padding:.5rem;}

.sinp{width:52px;height:38px;border:1px solid #d3d1c7;border-radius:8px;text-align:center;font-size:16px;font-weight:500;background:#fff;color:#1a1a18;font-family:inherit;padding:0;-moz-appearance:textfield;}
.sinp::-webkit-inner-spin-button,.sinp::-webkit-outer-spin-button{-webkit-appearance:none;}
.sinp:focus{border-color:#1D9E75;box-shadow:0 0 0 2px rgba(29,158,117,.12);outline:none;}
.sinp.blue{border-color:#378ADD;}
.comp-row{display:grid;grid-template-columns:1fr 80px;border-bottom:1px solid #e0ddd5;}
.comp-row:last-of-type{border-bottom:none;}
.comp-content{padding:.875rem .875rem .875rem 1.25rem;}
.comp-name{font-size:12px;font-weight:500;margin-bottom:3px;}
.comp-desc{font-size:11px;color:#5F5E5A;font-style:italic;margin-bottom:6px;line-height:1.5;}
.checks{font-size:11px;color:#888780;line-height:1.7;list-style:none;}

.checks li::before{content:'·';position:absolute;left:0;color:#b4b2a9;}
.subtotal{display:flex;justify-content:flex-end;align-items:center;gap:8px;padding:.6rem 1rem;background:#f9f8f4;border-top:1px solid #e0ddd5;}
.stval{font-size:16px;font-weight:500;min-width:24px;text-align:right;}
.stmax{font-size:12px;color:#888780;}
.jnote{font-size:11px;color:#888780;background:#f9f8f4;padding:.5rem .875rem;border-radius:6px;border-left:3px solid #d3d1c7;line-height:1.55;margin-bottom:1rem;}

.at{font-size:10px;font-weight:500;color:#888780;letter-spacing:.06em;margin-bottom:7px;}
.anchor-tbl{width:100%;border-collapse:collapse;font-size:11px;}
.anchor-tbl thead tr{background:#f9f8f4;}
.anchor-tbl th{text-align:left;padding:5px 10px;font-weight:500;font-size:10px;color:#5F5E5A;border-bottom:1px solid #e0ddd5;}
.anchor-tbl td{padding:6px 10px;border-bottom:1px solid #e0ddd5;vertical-align:middle;}
.anchor-tbl tr:last-child td{border-bottom:none;}
.total-bar{display:flex;justify-content:space-between;align-items:center;padding:1.25rem;background:#f4f3ef;border:1px solid #e0ddd5;border-radius:12px;margin-bottom:12px;}
.total-score{font-size:40px;font-weight:700;transition:color .2s;}
.note-sec{padding:.875rem 1.25rem;border-top:1px solid #e0ddd5;}
.note-lbl{font-size:10px;color:#888780;letter-spacing:.06em;margin-bottom:5px;display:flex;align-items:center;gap:6px;}
.note-badge{font-size:9px;padding:1px 7px;border-radius:10px;background:#f0f0ec;color:#888780;}
.cbadge{font-size:9px;padding:1px 7px;border-radius:10px;background:#E1F5EE;color:#0F6E56;}
.nb{width:100%;border:1px solid #d3d1c7;border-radius:8px;background:#f9f8f4;resize:none;font-family:inherit;font-size:12px;color:#1a1a18;padding:8px 12px;line-height:1.6;}
.cb{width:100%;border:1px solid #c5c3bc;border-radius:8px;background:#fff;resize:none;font-family:inherit;font-size:12px;color:#1a1a18;padding:8px 12px;line-height:1.6;}
.nb:focus,.cb:focus{outline:none;border-color:#1D9E75;box-shadow:0 0 0 2px rgba(29,158,117,.1);}
.tab-bar{display:flex;gap:6px;margin-bottom:1rem;flex-wrap:wrap;}
.tab{padding:6px 16px;border-radius:8px;cursor:pointer;font-size:13px;border:1px solid #d3d1c7;background:transparent;font-family:inherit;color:#1a1a18;transition:all .15s;}
.tab:hover{background:#f4f3ef;}
.tab.active{background:#1D9E75;color:#fff;border-color:#1D9E75;font-weight:500;}
.list-row{display:flex;align-items:center;justify-content:space-between;padding:.75rem 1.25rem;border-bottom:1px solid #e0ddd5;}
.list-row:last-child{border-bottom:none;}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.stat-card{background:#f9f8f4;border-radius:8px;padding:.75rem 1rem;}
.stat-lbl{font-size:10px;color:#888780;margin-bottom:3px;}
.stat-val{font-size:18px;font-weight:500;}
.screen-title{font-size:20px;font-weight:500;margin-bottom:4px;}
.screen-sub{font-size:12px;color:#888780;margin-bottom:1.5rem;}
.back-btn{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:#888780;background:none;border:none;cursor:pointer;font-family:inherit;padding:0;margin-bottom:1.25rem;}
.back-btn:hover{color:#1a1a18;}
.cand-btn{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;padding:.875rem 1.25rem;margin-bottom:8px;background:#fff;border:1px solid #e0ddd5;border-radius:10px;cursor:pointer;font-family:inherit;transition:border-color .15s;}
.cand-btn:hover{border-color:#1D9E75;}
.cand-btn.done{background:#f9f8f4;}
.empty{padding:2rem 1.25rem;text-align:center;font-size:13px;color:#888780;}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:1rem;}
.info-card{background:#f9f8f4;border-radius:8px;padding:.875rem 1.1rem;}
.info-card-title{font-size:10px;font-weight:500;color:#888780;letter-spacing:.06em;margin-bottom:8px;}
.loading{display:flex;align-items:center;justify-content:center;height:200px;font-size:13px;color:#888780;}
.home-card{padding:2rem 1.5rem;text-align:center;cursor:pointer;background:#fff;border:1px solid #e0ddd5;border-radius:12px;transition:border-color .15s,box-shadow .15s;font-family:inherit;width:100%;}
.home-card:hover{border-color:#1D9E75;box-shadow:0 0 0 3px rgba(29,158,117,.08);}
.icon-lg{font-size:28px;display:block;margin-bottom:10px;color:#888780;}

@media print {

  .btn, button { display: none !important; }
  .back-btn { display: none !important; }
  .tab-bar { display: none !important; }
}
</style>

function calcAvg(arr, key){
  const valid = arr.filter(s=>s[key]!=null);
  if(!valid.length) return null;
  return Math.round(valid.reduce((a,s)=>a+(s[key]||0),0)/valid.length*10)/10;
}

function vn(val){ const n=parseInt(val); return isNaN(n)?0:n; }
function scoreColor(s){ return s>=80?'#1D9E75':s>=60?'#378ADD':s>=40?'#BA7517':'#E24B4A'; }

async function getCandidates(){ const {data}=await db.from('candidates').select('*').order('created_at'); return data||[]; }
async function getInterviewers(){ const {data}=await db.from('interviewers').select('*').order('created_at'); return data||[]; }
async function getSubmissions(){ const {data}=await db.from('submissions').select('*').order('submitted_at'); return data||[]; }
async function addCandidate(c){ await db.from('candidates').insert(c); }
async function delCandidate(id){ await db.from('candidates').delete().eq('id',id); }
async function addInterviewer(name){ await db.from('interviewers').insert({name}); }
async function delInterviewer(id){ await db.from('interviewers').delete().eq('id',id); }
async function saveSubmission(s){ await db.from('submissions').insert(s); }
async function updateSubmission(id, s){ await db.from('submissions').update(s).eq('id', id); }
async function getSubmissionById(candidateId, interviewerName){
  const {data} = await db.from('submissions').select('*').eq('candidate_id', candidateId).eq('interviewer_name', interviewerName);
  return data && data.length > 0 ? data[0] : null;
}

    <IvCandidatesScreen ivName={ivName} candidates={candidates} submissions={submissions}
      loading={loading} loadAll={loadAll} onBack={()=>go('iv-select')}
      onSelect={c=>{setSelCand(c);setEditSub(null);go('iv-form');}}
      onEdit={async(c)=>{
        const sub = await getSubmissionById(c.id, ivName);
        setSelCand(c); setEditSub(sub); go('iv-form');
      }}/>
  );

  if(screen==='iv-form'&&selCand) return (
    <IvFormScreen ivName={ivName} candidate={selCand} editSub={editSub}
      onBack={()=>go('iv-candidates')}
      onSubmit={async(data)=>{
        if(editSub){
          await updateSubmission(editSub.id, data);
        } else {
          await saveSubmission(data);
        }
        setSubmittedName(data.candidate_name);
        go('submitted');
      }}/>
  );

  if(screen==='submitted') return (
    <div className="wrap" style={{textAlign:'center',paddingTop:'3rem'}}>
      <i className="ti ti-circle-check" style={{fontSize:52,color:'#1D9E75',display:'block',marginBottom:'1rem'}}/>
      <h2 style={{fontSize:22,fontWeight:500,marginBottom:8}}>제출 완료</h2>
      <p style={{fontSize:13,color:'#888780',marginBottom:'2rem'}}>{submittedName} 님 평가가 성공적으로 제출됐어요.</p>
      <div style={{display:'flex',gap:8,justifyContent:'center'}}>
        <button className="btn" onClick={()=>{setSelCand(null);go('iv-candidates');}}>다른 지원자 평가하기</button>
        <button className="btn primary" onClick={()=>{setIvName('');go('home');}}>완료</button>
      </div>
    </div>
  );
  return null;
}

function AdminScreen({candidates,setCandidates,interviewers,setInterviewers,submissions,loading,loadAll,adminTab,setAdminTab,detailCand,setDetailCand,onExit}){

  const [newIv,setNewIv]=useState('');
  const [saving,setSaving]=useState(false);

  async function handleAddCand(){
    if(!newCand.name.trim()||!newCand.rank1||!newCand.rank2) return alert('모든 항목을 입력해 주세요.');
    setSaving(true);
    await addCandidate(newCand);
    const c=await getCandidates(); setCandidates(c);
    setNewCand({name:'',rank1:'',rank2:''}); setSaving(false);
  }
  async function handleDelCand(id){
    if(!confirm('삭제하면 해당 지원자의 제출 데이터도 함께 삭제됩니다. 계속할까요?')) return;
    await delCandidate(id);
    const c=await getCandidates(); setCandidates(c);
  }
  async function handleAddIv(){
    if(!newIv.trim()) return;
    setSaving(true);
    await addInterviewer(newIv.trim());
    const i=await getInterviewers(); setInterviewers(i);
    setNewIv(''); setSaving(false);
  }
  async function handleDelIv(id){
    await delInterviewer(id);
    const i=await getInterviewers(); setInterviewers(i);
  }

  return (
    <div className="wrap">
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'1rem'}}>

        {[['candidates','지원자 관리'],['interviewers','면접관 관리'],['results','결과 취합']].map(([t,l])=>(
          <button key={t} className={`tab${adminTab===t?' active':''}`}
            onClick={()=>{setAdminTab(t);setDetailCand(null);}}>{l}</button>
        ))}
      </div>

      {adminTab==='candidates'&&<>
        <div className="card">
          <div className="card-head"><span className="card-head-title">지원자 추가</span></div>
          <div style={{padding:'1rem 1.25rem'}}>
            <div className="row" style={{marginBottom:8}}>
              <input type="text" placeholder="지원자 성함" value={newCand.name} onChange={e=>setNewCand({...newCand,name:e.target.value})}/>
            </div>
            <div className="row2" style={{marginBottom:10}}>
              <select value={newCand.rank1} onChange={e=>setNewCand({...newCand,rank1:e.target.value})}>
                <option value="">1순위 직군</option>
                {RANKS.map(r=><option key={r}>{r}</option>)}

              <select value={newCand.rank2} onChange={e=>setNewCand({...newCand,rank2:e.target.value})}>

        <div className="card">
          <div className="card-head"><span className="card-head-title">지원자 목록</span><span className="card-sub">{candidates.length}명</span></div>

          {candidates.map((c,i)=>{

function ResultsList({candidates,submissions,onSelect}){
  const [sortBy,setSortBy]=useState('total');
  const rows=candidates.map(c=>{
    const subs=submissions.filter(s=>s.candidate_id===c.id);
    const avg=subs.length>0?Math.round(subs.reduce((a,s)=>a+s.total,0)/subs.length):null;
    return{...c,subs,avg};
  }).sort((a,b)=>sortBy==='name'?a.name.localeCompare(b.name):(b.avg??-1)-(a.avg??-1));


  return(<>
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10}}>
      <span style={{fontSize:12,color:'#888780'}}>클릭하면 상세 결과를 볼 수 있어요</span>
      <div style={{display:'flex',gap:6,alignItems:'center'}}>
        <span style={{fontSize:11,color:'#888780'}}>정렬:</span>
        {[['total','총점'],['name','이름']].map(([k,l])=>(
          <button key={k} className={`btn sm${sortBy===k?' primary':''}`} onClick={()=>setSortBy(k)}>{l}</button>
        ))}
        <button className="btn sm" onClick={()=>downloadPDF('result-list','면접결과요약')} style={{background:'#E6F1FB',color:'#185FA5',border:'none'}}>
          <i className="ti ti-file-type-pdf"/> PDF 저장
        </button>
      </div>
    </div>
    <div id="print-area">
    <div className="card" id="result-list">
      <div className="card-head"><span className="card-head-title">지원자별 결과 요약</span><span className="card-sub">면접관 평균 기준</span></div>
      {rows.length===0&&<div className="empty">등록된 지원자가 없습니다.</div>}
      {rows.map((c,i)=>(
        <div key={c.id} className="list-row" onClick={()=>onSelect(c)}
          style={{cursor:'pointer',borderBottom:i<rows.length-1?undefined:'none'}}>
          <div>
            <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:4}}>
              {sortBy==='total'&&c.avg!==null&&<span style={{fontSize:13,fontWeight:700,color:'#888780',minWidth:20}}>{i+1}</span>}
              <p style={{fontWeight:500,fontSize:14}}>{c.name}</p>
            </div>
            <p style={{fontSize:11,color:'#888780'}}>
              1순위 <span className="badge bt">{c.rank1}</span>{' '}
              2순위 <span className="badge bb">{c.rank2}</span>{' '}
              · {c.subs.length}명 제출
            </p>
          </div>
          <div style={{textAlign:'right'}}>
            {c.avg!==null
              ?<><p style={{fontSize:26,fontWeight:700,color:scoreColor(c.avg)}}>{c.avg}</p><p style={{fontSize:10,color:'#888780'}}>평균 / 100점</p></>
              :<p style={{fontSize:12,color:'#b4b2a9'}}>미제출</p>}
          </div>
        </div>
      ))}
    </div>
  </div>
  </>);
}

function IvFormScreen({ivName,candidate,editSub,onBack,onSubmit}){
  const initScores = editSub ? {
    c1:String(editSub.c1||''), c2:String(editSub.c2||''), c3:String(editSub.c3||''), c4:String(editSub.c4||''),
    jikmu:String(editSub.jikmu_total||''), dam:String(editSub.damyeon||'')
  } : {c1:'',c2:'',c3:'',c4:'',jikmu:'',dam:''};
  const [scores,setScores]=useState(initScores);
  const [memo,setMemo]=useState(editSub?.memo||'');
  const [comment,setComment]=useState(editSub?.comment||'');
  const [submitting,setSubmitting]=useState(false);
  const [savedMsg,setSavedMsg]=useState('');
  const [draftLoaded,setDraftLoaded]=useState(false);

  useEffect(()=>{
    async function loadDraft(){
      try {
        const {data} = await db.from('drafts').select('data').eq('candidate_id', candidate.id).eq('interviewer_name', ivName);
        if(data && data.length > 0 && data[0].data){
          const d = data[0].data;
          if(d.scores) setScores(d.scores);
          if(d.memo) setMemo(d.memo);
          if(d.comment) setComment(d.comment);
          setSavedMsg('임시저장된 내용 불러옴 ✓');
          setTimeout(()=>setSavedMsg(''), 3000);
        }
      } catch(e){}
      setDraftLoaded(true);
    }
    loadDraft();
  },[]);

  const saveTimerRef = React.useRef(null);

  async function doSave(newScores, newMemo, newComment){
    try {
      const data = {scores:newScores, memo:newMemo, comment:newComment};
      const existing = await db.from('drafts').select('id').eq('candidate_id', candidate.id).eq('interviewer_name', ivName);
      if(existing.data && existing.data.length > 0){
        await db.from('drafts').update({data, updated_at: new Date().toISOString()}).eq('id', existing.data[0].id);
      } else {
        await db.from('drafts').insert({candidate_id: candidate.id, interviewer_name: ivName, data});
      }
      setSavedMsg('임시저장됨 ✓');
      setTimeout(()=>setSavedMsg(''), 2000);
    } catch(e){ console.error(e); }
  }

  function save(newScores, newMemo, newComment){
    if(saveTimerRef.current) clearTimeout(saveTimerRef.current);
    saveTimerRef.current = setTimeout(()=>{
      doSave(newScores, newMemo, newComment);
    }, 800);
  }

  function setScore(k,max,val){
    if(val===''){
      const ns={...scores,[k]:''};
      setScores(ns); save(ns,memo,comment); return;
    }
    let n=parseInt(val);
    if(isNaN(n))return;
    if(n<0)n=0; if(n>max)n=max;
    const ns={...scores,[k]:String(n)};
    setScores(ns); save(ns,memo,comment);
  }

  const compTotal=COMPS.reduce((s,c)=>s+vn(scores[c.id]),0);
  const jTotal=vn(scores.jikmu);
  const dam=vn(scores.dam);
  const grand=compTotal+jTotal+dam;

  async function handleSubmit(){
    setSubmitting(true);
    try { await db.from('drafts').delete().eq('candidate_id', candidate.id).eq('interviewer_name', ivName); } catch(e){}
    await onSubmit({
      candidate_id:candidate.id, candidate_name:candidate.name,
      rank1:candidate.rank1, rank2:candidate.rank2,
      interviewer_name:ivName,
      c1:vn(scores.c1),c2:vn(scores.c2),c3:vn(scores.c3),c4:vn(scores.c4),
      comp_total:compTotal, jikmu_total:jTotal, damyeon:dam, total:grand,
      memo, comment,
    });
    setSubmitting(false);
  }

  return(
    <div className="wrap">
      <button className="back-btn" onClick={onBack}><i className="ti ti-arrow-left"/> 뒤로</button>

      <div className="info-grid">
        <div className="info-card">
          <p className="info-card-title">면접관 정보</p>
          <p style={{fontWeight:500,fontSize:14}}>{ivName}</p>
        </div>
        <div className="info-card">
          <p className="info-card-title">지원자 정보</p>
          <p style={{fontWeight:500,fontSize:14}}>{candidate.name}</p>
          <p style={{fontSize:11,color:'#888780',marginTop:2}}>1순위 {candidate.rank1} · 2순위 {candidate.rank2}</p>
        </div>
      </div>

      {/* 공통역량 */}
      <div className="card">
        <div className="card-head">
          <div style={{display:'flex',alignItems:'center',gap:8}}>
            <span className="badge bt">공통역량</span>
            <span className="card-head-title">공통 역량 평가</span>
          </div>
          <span className="card-sub">항목당 5점 · 총 20점</span>
        </div>
        {COMPS.map((comp,i)=>(
          <div key={comp.id} className="comp-row" style={i===COMPS.length-1?{borderBottom:'none'}:{}}>
            <div className="comp-content">
              <p className="comp-name">{comp.name}</p>
              <p className="comp-desc">{comp.desc}</p>
              <ul className="checks">{comp.checks.map((c,j)=><li key={j}>{c}</li>)}</ul>
            </div>
            <div className="score-cell">
              <span className="score-lbl">점수 /5</span>
              <input type="number" className="sinp" value={scores[comp.id]} placeholder="0"
                onChange={e=>setScore(comp.id,5,e.target.value)}/>
            </div>
          </div>
        ))}
        <div className="subtotal">
          <span style={{fontSize:11,color:'#888780'}}>공통역량 소계</span>
          <span className="stval" style={{color:'#1D9E75'}}>{compTotal}</span>
          <span className="stmax">/ 20점</span>
        </div>
      </div>

      {/* 직무역량 */}
      <div className="card">
        <div className="card-head">
          <div style={{display:'flex',alignItems:'center',gap:8}}>
            <span className="badge bb">직무역량</span>
            <span className="card-head-title">직무 역량 평가</span>
          </div>
          <span className="card-sub">총 30점</span>
        </div>
        <div style={{padding:'1rem 1.25rem'}}>
          <p className="jnote">1·2순위 직군 역량을 종합적으로 평가하여 30점 이내에서 채점해 주세요. 1·2순위별 가중평균은 실무자가 별도 산출합니다.</p>
          <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:'1rem'}}>
            <input type="number" className="jbig" value={scores.jikmu} placeholder="0"
              onChange={e=>setScore('jikmu',30,e.target.value)}/>
            <span style={{fontSize:15,fontWeight:500,color:'#444'}}>/ 30점</span>
          </div>
          <p className="at">채점 기준 참고표</p>
          <table className="anchor-tbl">
            <thead><tr><th style={{width:110}}>점수 구간</th><th>수준 설명</th></tr></thead>
            <tbody>
              <tr><td><span className="pill ph">23–30점</span></td><td>직무 전문성이 탁월하고, 전환 후 즉시 기여 가능한 수준</td></tr>
              <tr><td><span className="pill pm">15–22점</span></td><td>역량이 충분하며, 단기 적응 이후 성과 창출이 가능한 수준</td></tr>
              <tr><td><span className="pill pl">7–14점</span></td><td>기본기는 있으나 추가 역량 개발이 필요한 수준</td></tr>
              <tr><td><span className="pill pp">7점 미만</span></td><td>직무 적합성이 낮으며 성과 창출이 어려울 것으로 판단</td></tr>
            </tbody>
          </table>
        </div>
        <div className="subtotal">
          <span style={{fontSize:11,color:'#888780'}}>직무역량 소계</span>
          <span className="stval" style={{color:'#378ADD'}}>{jTotal}</span>
          <span className="stmax">/ 30점</span>
        </div>
      </div>

      {/* 업적/역량평가 */}
      <div className="card">
        <div className="card-head">
          <div style={{display:'flex',alignItems:'center',gap:8}}>
            <span className="badge ba">업적/역량평가</span>
            <span className="card-head-title">업적/역량평가</span>
          </div>
          <span className="card-sub">50점</span>
        </div>
        <div style={{display:'grid',gridTemplateColumns:'1fr 80px'}}>
          <div style={{padding:'.875rem 1.25rem'}}>
            <p style={{fontSize:11,color:'#888780'}}>피플팀에서 별도 제공 · 아래에 제공받은 점수를 입력해 주세요</p>
            <div style={{display:'flex',gap:5,marginTop:8}}>
              {['2023년','2024년','2025년'].map(y=><span key={y} className="pill pl">{y}</span>)}
            </div>
          </div>
          <div className="score-cell">
            <span className="score-lbl">점수 /50</span>
            <input type="number" className="sinp" value={scores.dam} placeholder="0"
              onChange={e=>setScore('dam',50,e.target.value)}/>
          </div>
        </div>
        <div className="note-sec">
          <p className="note-lbl">특이사항 / 면접 메모 <span className="note-badge">면접 중 단편 기록</span></p>
          <textarea className="nb" rows={3} placeholder="면접 중 특이사항, 인상적인 답변 등을 간략히 기록해 주세요"
            value={memo} onChange={e=>{setMemo(e.target.value);save(scores,e.target.value,comment);}}/>
        </div>
        <div className="note-sec">
          <p className="note-lbl">최종평가 코멘트 <span className="cbadge">종합 의견</span></p>
          <textarea className="cb" rows={4} placeholder="면접 후 종합적인 평가 의견, 합격·불합격 추천 여부 및 근거를 기재해 주세요"
            value={comment} onChange={e=>{setComment(e.target.value);save(scores,memo,e.target.value);}}/>
        </div>
      </div>

      {/* 총합 */}
      <div className="total-bar">
        <div>
          <p style={{fontSize:14,fontWeight:500}}>최종 총합</p>
          <p style={{fontSize:10,color:'#888780',marginTop:2}}>공통역량 20 + 직무역량 30 + 업적/역량평가 50</p>
        </div>
        <div style={{display:'flex',alignItems:'baseline',gap:6}}>
          <span className="total-score" style={{color:scoreColor(grand)}}>{grand}</span>
          <span style={{fontSize:16,fontWeight:500,color:'#444441'}}>/100점</span>
        </div>
      </div>

      <div style={{textAlign:'center',marginBottom:8,fontSize:12,color:'#1D9E75',height:18}}>{savedMsg}</div>
      <button className="btn primary" style={{width:'100%',justifyContent:'center',padding:'14px',fontSize:15}}
        onClick={handleSubmit} disabled={submitting}>
        {submitting?'저장 중...':(editSub?'수정 저장하기':'평가 제출하기')}
      </button>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
